[project]
name = "neuroinsight"
version = "0.1.0"
description = "Turning visual stimuli into neuroscience-informed insights."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aanishka Thacker" }]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "opencv-contrib-python-headless>=4.10",
    "pillow>=11.0",
    "reportlab>=4.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "jinja2>=3.1",
    "requests>=2.32",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# Milestone 3: pretrained deep saliency model
deep = ["torch>=2.5", "torchvision>=0.20"]

[project.scripts]
neuroinsight = "neuroinsight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuroinsight"]

[tool.ruff]
line-length = 100
target-version = "py313"